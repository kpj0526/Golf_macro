<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Sun Valley Local Dummy Booking</title>
  <style>body{font:16px sans-serif;max-width:700px;margin:40px auto}label,input,button{margin:6px}#slots,#confirm,#complete{display:none}.slot{padding:8px;margin:5px}.chosen{background:#cfe8ff}</style>
</head>
<body>
  <h1>썬밸리 로컬 더미 예약</h1>
  <p id="status">로그인 대기</p>
  <section id="login"><label>아이디 <input id="id"></label><label>비밀번호 <input id="password" type="password"></label><button id="loginButton">로그인</button></section>
  <section id="slots"><h2>2026-06-23 예약 가능 시간</h2><button class="slot" data-time="0900">09:00</button><button class="slot" data-time="0930">09:30</button><button class="slot" data-time="1000">10:00</button></section>
  <section id="confirm"><p id="selection"></p><button id="confirmButton">예약 확정</button></section>
  <section id="complete"><h2>예약 완료</h2><p id="reservationNo"></p></section>
  <script>
    let chosen = null;
    const status = document.querySelector('#status');
    const loginPanel = document.querySelector('#login');
    const slotsPanel = document.querySelector('#slots');
    const confirmPanel = document.querySelector('#confirm');
    const completePanel = document.querySelector('#complete');
    const idInput = document.querySelector('#id');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#loginButton');
    const confirmButton = document.querySelector('#confirmButton');
    const selection = document.querySelector('#selection');
    const reservationNo = document.querySelector('#reservationNo');
    document.querySelector('#loginButton').onclick = () => {
      if (!idInput.value || !passwordInput.value) { status.textContent = '로그인 정보 필요'; return; }
      status.textContent = '로그인 완료 · 예약 페이지 1회 확인';
      loginPanel.style.display = 'none'; slotsPanel.style.display = 'block';
    };
    document.querySelectorAll('.slot').forEach(b => b.onclick = () => {
      chosen = b.dataset.time;
      document.querySelectorAll('.slot').forEach(x => x.classList.remove('chosen'));
      b.classList.add('chosen'); selection.textContent = '선택 시간: ' + chosen.slice(0,2)+':'+chosen.slice(2); confirmPanel.style.display = 'block';
    });
    document.querySelector('#confirmButton').onclick = () => {
      if (!chosen) return;
      confirmPanel.style.display = 'none'; completePanel.style.display = 'block';
      reservationNo.textContent = 'DUMMY-' + chosen + '-0001'; status.textContent = '더미 예약 완료';
    };
    // Browser-only mock macro: it makes one page check, chooses the nearest slot,
    // then clicks confirmation. It never opens a network connection.
    async function runDummyMacro() {
      idInput.value = 'dummy-user'; passwordInput.value = 'dummy-password'; loginButton.click();
      const desired = 930;
      const choices = [...document.querySelectorAll('.slot')];
      choices.sort((a,b) => Math.abs(+a.dataset.time-desired)-Math.abs(+b.dataset.time-desired) || (+a.dataset.time-(+b.dataset.time)));
      choices[0].click(); confirmButton.click();
    }
    if (location.search.includes('run=macro')) setTimeout(runDummyMacro, 20);
  </script>
</body>
</html>
